name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting (ruff check)
        run: uv run ruff check src/

      - name: Run formatting check (ruff format)
        run: uv run ruff format --check src/

      - name: Run type checking (mypy)
        run: uv run mypy src/wisdom_tree
        continue-on-error: true  # Don't fail on type errors yet

      - name: Run security checks (bandit)
        run: uv run bandit -r src/
        continue-on-error: true  # Don't fail on security warnings yet

      - name: Run tests with coverage
        run: uv run pytest tests/unit/ -v --cov=wisdom_tree --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for versioning

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Test installation
        run: |
          uv pip install dist/*.whl
          wisdom-tree --help || echo "wisdom-tree command not found (this is expected for now)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
